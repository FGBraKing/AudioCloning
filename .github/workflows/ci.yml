name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint & type & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src/audioclone

      - name: Unit / contract / API tests (no integration)
        run: uv run pytest -m "not integration" --cov=audioclone --cov-report=term-missing

      # 集成测试缺模型时按各测试的 skip 逻辑自动跳过（不再用 || true 吞失败）
      - name: Integration tests (skip if no models)
        run: uv run pytest -m integration -q --no-cov

      # 基准脚本冒烟：dummy-omni 快速验证工具链可用
      - name: Benchmark smoke (dummy-omni)
        run: uv run python -m tools.benchmark --backend dummy-omni --iterations 1
