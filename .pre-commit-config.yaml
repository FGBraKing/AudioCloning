# pre-commit 钩子（ruff + mypy + pytest）
# 安装: uv tool run pre-commit install
# 运行: uv tool run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/audioclone
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest (no integration)
        entry: uv run pytest -m "not integration" -q
        language: system
        pass_filenames: false
